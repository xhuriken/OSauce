<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSauce - Mobile Simulator (WebAssembly)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #020617;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            margin-bottom: 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #0f172a;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 12px #1e293b, 0 0 0 14px #334155;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas#canvas {
            width: 100% !important;
            height: 100% !important;
            outline: none;
        }
        #loading {
            position: absolute;
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>OSAUCE</h1>
        <p>Simulateur WebAssembly en direct</p>
    </div>
    <div class="phone-frame">
        <div id="loading">Chargement du simulateur...</div>
        <canvas id="canvas"></canvas>
    </div>

    <script type="module">
        import init from './pkg/osauce.js';
        async function run() {
            try {
                await init();
                const loader = document.getElementById('loading');
                if (loader) loader.style.display = 'none';
            } catch (err) {
                console.error("Erreur de chargement Wasm:", err);
                const loader = document.getElementById('loading');
                if (loader) loader.innerText = "Erreur de chargement Wasm";
            }
        }
        run();
    </script>
</body>
</html>
