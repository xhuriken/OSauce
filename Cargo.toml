[package]
name = "osauce"
version = "0.1.0"
edition = "2021"
authors = ["Célestin <celestin@honvault.com>"]
description = "OSauce - Compact, aesthetic and KISS mobile environment"
readme = "README.md"
license = "MIT OR Apache-2.0"

[[bin]]
name = "osauce-shell"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# UI Framework moderne et leger pour mobile et embarque
slint = "1.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }

[build-dependencies]
slint-build = "1.9"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
