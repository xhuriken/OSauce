# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings configured in this file.

# Enables AndroidX which is required for Jetpack & Compose libraries
android.useAndroidX=true

# Disables legacy Jetifier since modern libraries already target AndroidX
android.enableJetifier=false

# Generates non-transitive R classes to speed up incremental builds
android.nonTransitiveRClass=true

# JVM memory and encoding settings for Gradle Daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Suppresses warning about compileSdk 35 with AGP 8.5.2
android.suppressUnsupportedCompileSdk=35

# Kotlin coding style
kotlin.code.style=official

